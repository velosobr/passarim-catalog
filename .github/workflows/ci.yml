# CI do catalog: roda a cada push na main e a cada pull request. Os jobs são
# independentes e rodam em paralelo: testes, lint, segurança e, nas branches
# de comentários, a verificação "só comentários".

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Testes, conferência do código gerado pelo sqlc e vulnerabilidades
  # conhecidas nas dependências.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: código gerado pelo sqlc está atualizado
        run: go tool sqlc diff
      # -race detecta acesso concorrente perigoso. Os testes de integração
      # usam Docker, que já vem instalado nos runners do GitHub.
      # ffmpeg: os testes de WebP/AAC precisam dele. REQUIRE_FFMPEG=1 faz esses
      # testes FALHAREM (em vez de serem pulados) se ele não estiver instalado.
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: go test -race ./...
        env:
          REQUIRE_FFMPEG: "1"
      - name: govulncheck
        # v1.8.0: versões antigas do govulncheck dão panic ao analisar código Go
        # 1.27 (o golang.org/x/tools delas não entende a sintaxe nova).
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Lint: o golangci-lint junta vários verificadores (.golangci.yml).
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  # Segurança: o gitleaks procura segredos no histórico, e o Trivy procura
  # vulnerabilidades nas duas imagens Docker.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build da imagem
        run: docker build -t passarim-catalog:ci .
      # Trivy procura vulnerabilidades na imagem. Falha em HIGH/CRITICAL.
      # v0.36.0: versões antigas da action falham ao instalar o binário do
      # Trivy no runner.
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: passarim-catalog:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: build da imagem do worker
        run: docker build -f Dockerfile.worker -t passarim-worker:ci .
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: passarim-worker:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # Nas branches docs/comentarios-*, que só comentam o código, garante que
  # nenhuma linha de código mudou (scripts/check-comment-only.sh).
  comentarios:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'docs/comentarios-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # O histórico inteiro é necessário para comparar com a base do PR.
          fetch-depth: 0
      - run: bash scripts/check-comment-only_test.sh
      - run: bash scripts/check-comment-only.sh origin/${{ github.base_ref }}
