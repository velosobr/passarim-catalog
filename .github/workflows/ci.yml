name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: código gerado pelo sqlc está atualizado
        run: go tool sqlc diff
      # -race detecta acesso concorrente perigoso. Os testes de integração
      # usam Docker, que já vem instalado nos runners do GitHub.
      - run: go test -race ./...
      - name: govulncheck
        # v1.1.4 (pedida originalmente) dá panic ao analisar código Go 1.27
        # (golang.org/x/tools antigo não entende sintaxe nova). v1.8.0 é a
        # versão estável mais recente e funciona.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: build da imagem
        run: docker build -t passarim-catalog:ci .
      # Trivy procura vulnerabilidades na imagem. Falha em HIGH/CRITICAL.
      # a tag real é "v0.33.1" (a brief pedia "0.33.1", sem o "v", que não resolve)
      - uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: passarim-catalog:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
