scientific_name: Theristicus caudatus
common_name_pt: Curicaca
family: Threskiornithidae
size_cm: 69
diet: Artrópodes, como centopeias, aranhas, insetos adultos e larvas, além de pequenos lagartos, ratos, caramujos, anfíbios e pequenas serpentes.
conservation_status: LC
biomes: [amazonia, caatinga, pantanal]
states: [PA, CE, MT, MS]
description: >
  A curicaca é uma ave pernalta de pescoço esbranquiçado ou alaranjado,
  peito alaranjado, dorso verde-acinzentado, partes inferiores escuras e
  pernas avermelhadas, com um bico longo e curvo típico da família dos
  íbis. Vive em vegetação aberta próxima a lagoas e campos periodicamente
  alagados, como na Ilha de Marajó, no Pantanal e no Ceará. Caça artrópodes,
  pequenos lagartos, roedores, anfíbios e até pequenas serpentes, sendo
  comum vê-la em bandos barulhentos sobrevoando áreas úmidas.
description_source_url: https://www.wikiaves.com.br/wiki/curicaca
facts:
  - text: O nome popular vem do tupi "kurikaka", numa referência aos hábitos gregários e ao voo potente da ave, encontrada sobretudo em brejos e pântanos.
    source: https://pt.wikipedia.org/wiki/Curicaca
  - text: É a ave símbolo do município de São José dos Ausentes, no Rio Grande do Sul, por lei municipal de dezembro de 2005.
    source: https://pt.wikipedia.org/wiki/Curicaca
  - text: Além de artrópodes como centopeias e aranhas, também caça pequenos lagartos, ratos, caramujos, anfíbios e até pequenas serpentes.
    source: https://www.wikiaves.com.br/wiki/curicaca
