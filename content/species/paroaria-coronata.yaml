scientific_name: Paroaria coronata
common_name_pt: Cardeal
family: Thraupidae
size_cm: 18
diet: Grãos e pequenos artrópodes.
conservation_status: LC
biomes: [cerrado, pampa, mata_atlantica]
primary_biome: pampa
states: [MT, MS, PR, RS, SP]
description: >
  O cardeal, também chamado de cardeal-de-topete-vermelho, galo-de-campina
  ou guiratirica, é um pássaro de grande beleza, tanto na plumagem quanto
  no canto — o que faz dele um dos mais caçados para cativeiro. Vive em
  bordas de arrozais, campos com vegetação alta e bordas de mata no
  Centro-Oeste e no Sul do Brasil, com uma população introduzida na região
  Sudeste, principalmente em São Paulo. Não há diferença visível entre
  macho e fêmea; os filhotes nascem pardacentos, com o topete em tom
  ferrugíneo.
description_source_url: https://www.wikiaves.com.br/wiki/cardeal
facts:
  - text: Não apresenta dimorfismo sexual (macho e fêmea são iguais); os filhotes nascem com plumagem pardacenta e o topete em tom ferrugíneo.
    source: https://www.wikiaves.com.br/wiki/cardeal
  - text: É uma ave de grande beleza física e sonora, o que faz dela um dos pássaros mais caçados para criação em cativeiro.
    source: https://www.wikiaves.com.br/wiki/cardeal
  - text: É territorialista no período reprodutivo. Cada ninhada tem de 2 a 3 ovos, com até 4 ninhadas por temporada, e os filhotes nascem cerca de 13 dias após a postura.
    source: https://www.wikiaves.com.br/wiki/cardeal
  - text: Ocorre naturalmente em Mato Grosso, Mato Grosso do Sul, Paraná e Rio Grande do Sul, e foi introduzido na região Sudeste, principalmente em São Paulo; fora do Brasil, mantém populações estabelecidas no Havaí, em Porto Rico e no Chile.
    source: https://www.wikiaves.com.br/wiki/cardeal
