scientific_name: Amazona aestiva
common_name_pt: Papagaio-verdadeiro
family: Psittacidae
size_cm: 37
diet: Sementes, frutos e folhas.
conservation_status: NT
biomes: [caatinga, cerrado, pantanal]
states: [PI, PE, BA, SP, MG, RJ, SC, RS]
description: >
  O papagaio-verdadeiro é um psitacídeo de plumagem predominantemente verde,
  com cabeça amarela, azul-esverdeado na fronte e nas bochechas, e ombros
  vermelhos. Ocorre no interior do Brasil, do Nordeste ao Sul, habitando
  florestas úmidas, savanas, matas de galeria e áreas cultivadas com
  árvores. É um dos papagaios mais populares como animal de estimação no
  país, o que também o tornou alvo histórico de captura ilegal para o
  tráfico de aves silvestres, contribuindo para seu status de quase
  ameaçada.
description_source_url: https://pt.wikipedia.org/wiki/Papagaio-verdadeiro
facts:
  - text: Costuma nidificar em buracos de rochas erodidas, barrancos ou ocos de árvores; os filhotes passam cerca de dois meses no ninho e a espécie só atinge a maturidade por volta dos cinco anos de idade.
    source: https://www.wikiaves.com.br/wiki/papagaio-verdadeiro
  - text: O casal costuma voar tão próximo que parece formar uma única ave de quatro asas, e à noite os indivíduos se reúnem em bandos para dormir.
    source: https://www.wikiaves.com.br/wiki/papagaio-verdadeiro
  - text: Tem se tornado cada vez mais comum em áreas urbanas de cidades como São Paulo e Rio de Janeiro.
    source: https://www.wikiaves.com.br/wiki/papagaio-verdadeiro
