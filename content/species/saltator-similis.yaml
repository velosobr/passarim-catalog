scientific_name: Saltator similis
common_name_pt: Trinca-ferro
family: Thraupidae
size_cm: 20
diet: Frutos, sementes, brotos e folhas tenras; ocasionalmente insetos.
conservation_status: LC
biomes: [mata_atlantica, cerrado, pampa]
primary_biome: mata_atlantica
states: [SP, RJ, MG, ES, BA, GO, PR, SC, RS, MS]
description: >
  O trinca-ferro, também conhecido como trinca-ferro-verdadeiro, é um
  pássaro de dorso verde-oliváceo, peito cinzento e garganta clara,
  contornada por uma faixa escura, com bico curto e grosso de ponta
  alaranjada. Vive em bordas de mata, capoeiras, matas de galeria e
  parques, geralmente na copa das árvores, onde costuma ser mais ouvido
  do que visto. É famoso pelo canto forte e variado, o que o torna um dos
  pássaros mais cobiçados para criação em cativeiro.
description_source_url: https://pt.wikipedia.org/wiki/Trinca-ferro
facts:
  - text: O canto forte e variado é a marca da espécie, e por isso o trinca-ferro é um dos pássaros silvestres mais visados pelo tráfico de animais no Brasil.
    source: https://pt.wikipedia.org/wiki/Trinca-ferro
  - text: O nome popular vem do bico curto e robusto, capaz de quebrar sementes duras; o trinca-ferro também come brotos, folhas e frutos.
    source: https://pt.wikipedia.org/wiki/Trinca-ferro
kids:
  description: >
    O trinca-ferro tem costas verde-oliva, peito cinzento e bico curto de ponta
    laranja. Vive em bordas de mata e parques, quase sempre no alto das árvores.
    É mais fácil ouvir seu canto forte e variado do que vê-lo.
  facts:
    - text: Pessoas tiram essas aves da natureza por causa do canto, e isso é proibido.
      source_fact: 0
    - text: O nome vem do bico forte, que consegue quebrar sementes duras.
      source_fact: 1
  did_you_know: Além de sementes, ele também come brotos, folhas e frutos.
